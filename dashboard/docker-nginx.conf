# 컨테이너 내부용 nginx 설정. Vite 빌드가 base:'/dashboard/'로 돼있어서 정적 파일이
# "/dashboard/assets/..." 경로를 기대한다 - 로컬 개발용 observability/nginx.conf가
# 대시보드를 /dashboard/ 서브패스로 서빙하는 것과 같은 이유로, 여기서도 같은 서브패스를 맞춰준다.
server {
    listen 80;

    location = / {
        return 302 /dashboard/;
    }

    location /dashboard/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /dashboard/index.html;
    }
}
