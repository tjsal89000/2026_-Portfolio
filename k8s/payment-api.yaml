apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-api }
  template:
    metadata:
      labels: { app: payment-api }
    spec:
      containers:
        - name: payment-api
          # 로컬에서 빌드한 이미지를 레지스트리 없이 클러스터에 직접 임포트해 쓰는 걸 전제로
          # imagePullPolicy: Never로 둔다 (k3d/minikube 등 로컬 클러스터에서 흔한 패턴).
          # 실제 배포(Phase 12)에서는 이미지를 레지스트리에 푸시하고 태그/정책을 바꾼다.
          image: aiops/payment-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo:4318/v1/traces"
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          # JVM 기동 자체가 느린 데다, Kafka가 아직 준비되지 않은 상태(예: 클러스터 전체가 같이
          # 재시작되는 상황)에서는 Kafka AdminClient 부트스트랩 재시도까지 겹쳐서 기동에 70초 이상
          # 걸리는 걸 실제로 겪었다. liveness probe의 initialDelaySeconds(30s)가 그보다 짧으면,
          # 앱이 다 뜨기도 전에 "안 죽었나?"를 체크하다 오탐으로 죽이고 재시작 - 그러면 다음
          # 시도도 다시 느려서 영원히 못 뜨는 상태에 빠진다. startupProbe로 "다 뜰 때까지는
          # liveness/readiness를 아예 체크하지 않기"를 명시적으로 분리해 이 문제를 해결했다.
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 40 # 5초 * 40 = 최대 200초까지 기동 시간을 봐줌
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: aiops
spec:
  selector: { app: payment-api }
  ports:
    - port: 8080
      targetPort: 8080
