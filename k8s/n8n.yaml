apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: aiops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: n8n }
  template:
    metadata:
      labels: { app: n8n }
    spec:
      # Service 이름이 "n8n"이라 Kubernetes가 N8N_PORT=tcp://... 를 자동 주입하고, n8n이 이 값을 포트로 읽다 기동에 실패한다.
      # 서비스 링크 환경변수를 끄고 DNS(n8n:5678)로만 접근한다.
      enableServiceLinks: false
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          ports:
            - containerPort: 5678
          env:
            # HTTPS 전용 도메인(n8n.ygrhash.dev) 뒤에서 동작한다. nginx가 TLS를 끝내고 http로 넘긴다.
            - name: N8N_PROTOCOL
              value: "https"
            - name: N8N_HOST
              value: "n8n.ygrhash.dev"
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n.ygrhash.dev/"
            - name: N8N_WEBHOOK_URL
              value: "https://n8n.ygrhash.dev/"
            # 웹훅 보호: 워크플로우의 코드 노드가 이 값과 요청 헤더(x-alert-secret)를 비교한다
            - name: ALERT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: alert-webhook-secret
                  key: ALERT_WEBHOOK_SECRET
            # 힙 상한을 컨테이너 메모리 한도 안쪽으로 맞춘다 (기본값으로 두면 시작 중 OOM으로 재시작 반복)
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            # 앞단 nginx 한 단계를 신뢰해서 실제 접속 주소(X-Forwarded-*)를 쓰게 한다
            - name: N8N_PROXY_HOPS
              value: "1"
            # 기본값(::)은 IPv6로만 듣는 경우가 있어서, nginx가 쓰는 IPv4 주소로도 받도록 명시한다
            - name: N8N_LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: N8N_SECURE_COOKIE
              value: "true"
          resources:
            requests: { cpu: "50m", memory: "512Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: aiops
spec:
  selector: { app: n8n }
  ports:
    - port: 5678
      targetPort: 5678
