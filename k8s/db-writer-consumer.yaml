apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-writer-consumer
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: db-writer-consumer }
  template:
    metadata:
      labels: { app: db-writer-consumer }
    spec:
      containers:
        - name: db-writer-consumer
          image: aiops/db-writer-consumer:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/aiops_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "aiops"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "aiops123"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo:4318/v1/traces"
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          # payment-api와 같은 이유(문제해결_로그.md [6]번 참고 - 이 프로젝트에서 클러스터
          # 전체가 동시에 재시작되면 JVM+Kafka 부트스트랩이 겹쳐 기동이 70초 이상 걸리는 걸
          # 실제로 겪음) - startupProbe로 기동 시간을 넉넉히 봐주고, 그동안은 liveness가
          # 오탐으로 죽이지 않게 분리한다.
          startupProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: db-writer-consumer
  namespace: aiops
spec:
  selector: { app: db-writer-consumer }
  ports:
    - port: 8081
      targetPort: 8081
