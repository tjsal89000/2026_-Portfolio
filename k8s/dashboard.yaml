# (Phase 12에서 해결됨) 예전엔 프론트엔드 코드에 "http://localhost"가 하드코딩돼 있어서
# EC2 공인 IP로 접근하면 브라우저가 자기 자신의 localhost로 요청을 보내버려 깨졌다 -
# window.location.origin 기준으로 주소를 동적 생성하도록 고쳐서(dashboard/src/apiOrigin.ts)
# 빌드 시점 주입 없이도 로컬/EC2 어디서 열어도 항상 맞게 만들었다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      containers:
        - name: dashboard
          image: aiops/dashboard:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "20m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: aiops
spec:
  selector: { app: dashboard }
  ports:
    - port: 80
      targetPort: 80
