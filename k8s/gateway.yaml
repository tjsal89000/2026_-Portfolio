apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: aiops/gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8095
          env:
            - name: PAYMENT_API_URL
              value: "http://payment-api:8080/payments"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aiops
spec:
  selector: { app: gateway }
  ports:
    - port: 8095
      targetPort: 8095
