# GOOGLE_API_KEY는 이 파일에 값을 직접 적지 않는다 (평문 커밋 방지 - 이 프로젝트 전체에서
# 지켜온 "비밀값은 파일/채팅에 적지 말고 대상 시스템에 직접 넣기" 원칙과 동일).
# 배포 전에 아래 명령으로 Secret을 먼저 만들어야 한다 (실제 키 값으로 교체):
#
#   kubectl create secret generic report-agent-secrets \
#     --namespace aiops \
#     --from-literal=GOOGLE_API_KEY=<발급받은_키>
#
# REPORT_DB_DSN(Postgres 접속 문자열)은 GOOGLE_API_KEY와 달리 컨테이너끼리만 쓰는 내부
# 값이라 user_data.sh.tpl이 프로비저닝 시점에 무작위로 생성해 postgres-secrets Secret에
# 자동으로 넣어준다 - 여기서는 그 Secret을 참조만 한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-agent
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: report-agent }
  template:
    metadata:
      labels: { app: report-agent }
    spec:
      containers:
        - name: report-agent
          image: aiops/report-agent:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8092
          env:
            - name: MCP_SERVER_URL
              value: "http://mcp-server:8090/mcp"
            - name: REPORT_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: REPORT_DB_DSN
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: report-agent-secrets
                  key: GOOGLE_API_KEY
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: report-agent
  namespace: aiops
spec:
  selector: { app: report-agent }
  ports:
    - port: 8092
      targetPort: 8092
