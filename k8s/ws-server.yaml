apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-server
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: ws-server }
  template:
    metadata:
      labels: { app: ws-server }
    spec:
      containers:
        - name: ws-server
          image: aiops/ws-server:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8096
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "aiops"
            - name: POSTGRES_PASSWORD
              value: "aiops123"
            - name: POSTGRES_DB
              value: "aiops_db"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ws-server
  namespace: aiops
spec:
  selector: { app: ws-server }
  ports:
    - port: 8096
      targetPort: 8096
