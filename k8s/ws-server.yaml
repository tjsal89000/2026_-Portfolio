# "인프라 현황" 페이지가 Pod 목록을 보여줄 수 있도록, ws-server 전용 ServiceAccount에
# aiops 네임스페이스 안에서 Pod를 읽기만 할 수 있는 최소 권한만 부여한다 (list/get, 쓰기 권한 없음,
# 다른 네임스페이스 접근 불가 - RBAC은 항상 필요한 만큼만).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ws-server
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ws-server-pod-reader
  namespace: aiops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ws-server-pod-reader
  namespace: aiops
subjects:
  - kind: ServiceAccount
    name: ws-server
    namespace: aiops
roleRef:
  kind: Role
  name: ws-server-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-server
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: ws-server }
  template:
    metadata:
      labels: { app: ws-server }
    spec:
      serviceAccountName: ws-server
      containers:
        - name: ws-server
          image: aiops/ws-server:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8096
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            # 장애 주입 시연 스위치. 기본은 꺼짐. 면접 때만 "true"로 바꿔 apply하고, 끝나면 다시 "false".
            - name: CHAOS_ENABLED
              value: "false"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "aiops"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "aiops_db"
            - name: AWS_REGION
              value: "ap-northeast-2"
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ws-server
  namespace: aiops
spec:
  selector: { app: ws-server }
  ports:
    - port: 8096
      targetPort: 8096
