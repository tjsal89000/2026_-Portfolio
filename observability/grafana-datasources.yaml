# Grafana가 뜰 때 이 파일을 읽어서 데이터소스 2개(메트릭용 Prometheus, 트레이스용 Tempo)를
# 화면에서 수동으로 등록할 필요 없이 자동으로 만들어준다 ("대시보드도 코드로 관리"와 같은 맥락).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Prometheus를 --web.route-prefix=/prometheus/ 로 띄워놔서, API 경로도 그 프리픽스 밑에 있음.
    # 이걸 빼먹어서 Grafana가 Prometheus를 못 찾아 그래프가 전부 비어 보였었음.
    url: http://prometheus:9090/prometheus/
    isDefault: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
