# 흩어진 서비스들(대시보드/Grafana/n8n/Prometheus/API)을 http://localhost 하나로 묶어주는
# 리버스프록시. 실무에서도 Ingress/API Gateway가 정확히 이 역할(경로별로 뒤에 있는
# 서비스로 요청을 나눠 보내는 것)을 한다 - Phase 9(API Gateway)에서 다룰 개념을 인프라 레벨에서 미리 적용.
server {
    listen 80;

    # 루트로 들어오면 대시보드로 보냄
    location = / {
        return 302 /dashboard/;
    }

    # 커스텀 React 대시보드 (Vite 개발서버, 호스트에서 직접 실행 중)
    # proxy_pass에 경로(trailing "/")를 안 붙여야 nginx가 "/dashboard/" 프리픽스를 벗기지 않고
    # 그대로 전달한다. Vite가 base:'/dashboard/'로 설정돼 있어서, 프리픽스가 벗겨진 채로 오면
    # "나는 /dashboard/여야 하는데 /로 왔네"라며 계속 리다이렉트를 걸어 무한루프가 생겼었다.
    location /dashboard/ {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        # Vite의 HMR(핫리로드)은 WebSocket을 쓰므로 업그레이드 헤더를 그대로 전달해야 함
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Grafana (같은 docker-compose 네트워크 안이라 서비스 이름으로 접근)
    # 위와 같은 이유로 trailing "/" 없이 프리픽스를 보존해서 전달 (GF_SERVER_SERVE_FROM_SUB_PATH와 짝을 맞춤)
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # n8n - 서브패스로 직접 물지 않고 자기 포트로 리다이렉트만 해줌.
    # n8n은 리버스프록시 서브패스 배포 시 정적 자산 경로가 깨지는 알려진 이슈가 있어서
    # (github.com/n8n-io/n8n issues #18596, #19635), 무리하게 프록시하지 않고
    # "그 포트로 곧장 보내주는" 방식으로 단순화함 (n8n은 아직 실사용 전이라 영향 없음)
    location /n8n/ {
        return 302 http://localhost:5678/;
    }

    # Prometheus (route-prefix로 서브패스 서빙하도록 이미 설정해둠)
    location /prometheus/ {
        proxy_pass http://prometheus:9090/prometheus/;
        proxy_set_header Host $host;
    }

    # 결제 API - Phase 9부터는 payment-api(8080)로 직접 보내지 않고 API 게이트웨이(8095)를
    # 거친다. trailing slash를 빼서 "/api/payments" 경로를 그대로 게이트웨이에 전달한다
    # (게이트웨이 자신의 라우트도 "/api/payments"라서 프리픽스를 벗겨내면 안 됨).
    location /api/ {
        proxy_pass http://host.docker.internal:8095;
        proxy_set_header Host $host;
    }

    # 이상탐지 에이전트의 알림 on/off 제어 서버 (대시보드 사이드바 토글이 호출)
    location /alerts/ {
        proxy_pass http://host.docker.internal:8091/;
        proxy_set_header Host $host;
    }

    # AI 리포트 에이전트 트리거 (n8n Schedule Trigger의 HTTP Request 노드가 호출)
    location /report/ {
        proxy_pass http://host.docker.internal:8092/;
        proxy_set_header Host $host;
    }

    # 대시보드 실시간 WebSocket 서버 - payment:events:live/payment:alerts:live 브로드캐스트(/ws)와
    # AI 리포트 조회(/reports/latest)를 같이 서빙. Vite HMR과 마찬가지로 Upgrade 헤더를 전달해야
    # WebSocket 핸드셰이크가 됨.
    location /ws-server/ {
        proxy_pass http://host.docker.internal:8096/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
